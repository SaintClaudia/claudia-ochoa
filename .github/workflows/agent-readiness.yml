name: Agent readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-readiness
  cancel-in-progress: false

jobs:
  live-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker-csp/package-lock.json
      - name: Install Worker dependencies
        working-directory: worker-csp
        run: npm ci
      - name: Test local agent contracts
        working-directory: worker-csp
        run: npm test
      - name: Test live agent journey
        working-directory: worker-csp
        run: npm run eval:readiness
