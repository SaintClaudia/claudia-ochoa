<div class="contact-overlay" id="contact-drawer" role="dialog" aria-modal="true" aria-labelledby="contact-drawer-title" aria-hidden="true">
  <button class="contact-overlay-close" id="contact-drawer-close" aria-label="Close contact form">&times;</button>
  <div class="contact-overlay-inner">
    <h2 class="contact-overlay-label" id="contact-drawer-title">Say hello</h2>
    <form id="contact-form" class="contact-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="2135e194-3403-43df-b617-bdb4ce01ba13">
      <div class="contact-field">
        <label for="contact-name" class="contact-field-label">Name</label>
        <input type="text" id="contact-name" name="name" class="contact-input" required>
      </div>
      <div class="contact-field">
        <label for="contact-email" class="contact-field-label">Email or phone</label>
        <input type="text" id="contact-email" name="email_or_phone" class="contact-input" required>
      </div>
      <div class="contact-field">
        <label for="contact-message" class="contact-field-label">Message</label>
        <textarea id="contact-message" name="message" class="contact-input contact-textarea" required></textarea>
      </div>
      <button type="submit" class="contact-submit">Send</button>
      <p class="contact-form-status" id="contact-form-status" role="status"></p>
    </form>
  </div>
</div>
