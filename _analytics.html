<!-- Google Analytics loads after first interaction or a quiet 30-second window. -->
<script>
  (function () {
    // The gtag.js URL is a fixed, hardcoded string — never user input — so
    // this policy is a pass-through, not a sanitizer.
    var ttPolicy = (window.trustedTypes && trustedTypes.createPolicy)
      ? trustedTypes.createPolicy('site-analytics', { createScriptURL: function (url) { return url; } })
      : null;

    var analyticsStarted = false;
    var analyticsTimer;
    var interactionEvents = ['pointerdown', 'keydown', 'scroll'];

    function loadAnalytics() {
      if (analyticsStarted) return;
      analyticsStarted = true;
      window.clearTimeout(analyticsTimer);
      interactionEvents.forEach(function (eventName) {
        window.removeEventListener(eventName, loadAnalytics);
      });

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', 'G-3G6X2P2669');

      var gtagUrl = 'https://www.googletagmanager.com/gtag/js?id=G-3G6X2P2669';
      var script = document.createElement('script');
      script.async = true;
      script.src = ttPolicy ? ttPolicy.createScriptURL(gtagUrl) : gtagUrl;
      document.head.appendChild(script);
    }

    interactionEvents.forEach(function (eventName) {
      window.addEventListener(eventName, loadAnalytics, { once: true, passive: true });
    });
    window.addEventListener('load', function () {
      if (!analyticsStarted) analyticsTimer = window.setTimeout(loadAnalytics, 30000);
    }, { once: true });
  }());
</script>
